# Temporary overrides to assist the development of continuous internode validation.
- name: enable_continuous_internode_validation_per_document_feature_flag_mongod
  value:
    executor:
      fixture:
        mongod_options:
          set_parameters:
            featureFlagContinuousInternodeValidationPerDocument: true
            featureFlagRecordIdsReplicated: true
            # Clustered collections have no replicated record ids, so their updates and deletes
            # only reach the hash check through the by-record-id apply fast path.
            featureFlagClusteredCollectionOplogApplyFastPath: true
- name: three_node_replica_set
  value:
    executor:
      fixture:
        num_nodes: 3
