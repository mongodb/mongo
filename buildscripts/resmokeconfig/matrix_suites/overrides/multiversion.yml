- name: jstestfuzz_replication_multiversion_hooks
  value:
    executor:
      hooks:
        - class: FuzzerRestoreSettings
        - class: LagOplogApplicationInBackground
          shell_options:
            nodb: ""
        - class: CheckReplOplogs
        - class: CheckReplDBHash
          shell_options:
            global_vars:
              TestData:
                skipValidationOnInvalidViewDefinitions: true
        - class: ValidateCollections
          shell_options:
            global_vars:
              TestData:
                skipValidationOnInvalidViewDefinitions: true

- name: jstestfuzz_sharded_multiversion_hooks
  value:
    executor:
      hooks:
        - class: CheckRoutingTableConsistency
          shell_options:
            global_vars:
              TestData:
                mayForgeReshardingTempCollections: true
        - class: FuzzerRestoreSettings
        - class: CheckReplDBHash
          shell_options:
            global_vars:
              TestData:
                skipValidationOnInvalidViewDefinitions: true
        - class: ValidateCollections
          shell_options:
            global_vars:
              TestData:
                skipValidationOnInvalidViewDefinitions: true

- name: otel_tracing
  value:
    executor:
      config:
        shell_options:
          global_vars:
            TestData:
              # TODO (SERVER-111403): Enable OpenTelemetry tracing in multiversion suites.
              enableOTELTracing: false

