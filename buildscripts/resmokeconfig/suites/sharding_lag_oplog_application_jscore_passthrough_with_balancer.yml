test_kind: js_test

selector:
  roots:
    - jstests/core/**/*.js
    - jstests/core_sharding/**/*.js
    - jstests/fle2/**/*.js
    - src/mongo/db/modules/*/jstests/fle2/**/*.js
  exclude_files:
    # The following tests fail because a certain command or functionality is not supported on
    # mongos. This command or functionality is placed in a comment next to the failing test.
    - jstests/core/**/apitest_db.js # serverStatus output doesn't have storageEngine.
    - jstests/core/**/check_shard_index.js # checkShardingIndex.
    - jstests/core/**/compact_keeps_indexes.js # compact.
    - jstests/core/**/currentop.js # uses fsync.
    - jstests/core/**/dbhash.js # dbhash.
    - jstests/core/**/fsync.js # uses fsync.
    - jstests/core/**/geo_update_btree2.js # notablescan.
    - jstests/core/**/queryoptimizera.js # "local" database.
    - jstests/core/**/startup_log.js # "local" database.
    - jstests/core/**/query/top/top.js # top.

    # The following tests fail because mongos behaves differently from mongod when testing certain
    # functionality. The differences are in a comment next to the failing test.
    - jstests/core/**/geo_2d_explain.js # executionSuccess in different spot in explain().
    - jstests/core/**/geo_s2explain.js # inputStage in different spot in explain().
    - jstests/core/**/geo_s2sparse.js # keysPerIndex in different spot in validate().
    - jstests/core/**/operation_latency_histogram.js # Stats are counted differently on mongos, SERVER-24880.

    # transactionLifetimeLimitSeconds parameter is not available in mongos.
    - jstests/core/txns/abort_expired_transaction.js
    - jstests/core/txns/abort_transaction_thread_does_not_block_on_locks.js
    - jstests/core/txns/kill_op_on_txn_expiry.js

    # Uses hangAfterCollectionInserts failpoint not available on mongos.
    - jstests/core/txns/speculative_snapshot_includes_all_writes.js

    # TODO SERVER-88275: A moveCollection command changes the UUID of the targeted collection.
    # Any query using an auto yielding policy will likely return a QueryPlanKilled error if a moveCollection commit happens during the query execution.
    - jstests/core/timeseries/geo/timeseries_geonear_random_measurements.js
    - jstests/core/timeseries/query/timeseries_homogeneous_top_bottom.js

    # moveCollection and the many deleteMany commands in this test block each other and can easily cause the test to time out.
    # This is caused by the pauseMigrationsDuringMultiUpdates cluster parameter and the random migrations failpoint both being enabled for this suite.
    # TODO SERVER-91655: re-enable this test in this suite or potentially in a noPassthrough suite.
    - jstests/core/timeseries/query/timeseries_predicates.js
    # TODO SERVER-91722: re-enable this test in this suite or potentially in a noPassthrough suite.
    - jstests/core/index/geo/geo_update_btree.js
    - jstests/core/**/remove_adjacent_index_keys.js
    - jstests/core/query/delete/remove_with_in.js

    # override library is not able to intercept createIndex commands executed inside benchRun
    - jstests/core/**/bench_test1.js
    # moveCollection will drop indexes which will reset index statistics this test asserts on.
    - jstests/core/index/index_stats.js

    # implicitly_retry_on_migration_in_progress.js exhausts the non-transactional find and returns cursor id 0, so killCursors succeeds instead of failing.
    - jstests/core/txns/kill_cursors_in_transaction.js

    # Open transactions / DDL-blocking txn tests conflict with random migrations and oplog lag,
    # causing LockTimeouts and suite shard timeouts.
    - jstests/core/txns/many_txns.js
    - jstests/core/txns/transactions_block_ddl.js
    - jstests/core/txns/create_indexes_parallel.js

    # 400-run PBT; too slow under lag + balancer.
    - jstests/core/index/index_for_sort_pbt.js
    # 150-run PBT; too slow under lag + balancer.
    - jstests/core/index/express_pbt.js

    # Random moveCollection can abort a transaction with a migration error instead of WriteConflict, so the expected winner and final documents are not stable.
    - jstests/core/txns/transactions_write_conflicts.js
    # The test waits until currentOp shows the non-txn write blocked with writeConflicts > 0.
    # Random moveCollection keeps that write off the write-conflict path, so the wait times out.
    - jstests/core/txns/write_conflicts_with_non_txns.js
    # Random moveCollection aborts the open transaction with TransientTransactionError, and this test does not retry.
    - jstests/core/txns/find_and_modify_in_transaction.js
    # Open txn + drop races with random moveCollection (TransientTransactionError /
    # ConflictingOperationInProgress)
    - jstests/core/txns/drop_collection_not_blocked_by_txn.js

    # Heavy createIndex/dropIndex loop; too slow under random migrations + oplog lag
    # (pauseMigrationsDuringMultiUpdates + retry-on-migration).
    - jstests/core/timeseries/ddl/timeseries_index_use.js

  exclude_with_any_tags:
    - assumes_standalone_mongod
    - assumes_against_mongod_not_mongos
    # system.profile collection doesn't exist on mongos.
    - requires_profiling
    # Prepare is not a command on mongos.
    - uses_prepare_transaction
    - assumes_balancer_off
    # fsync lock is not compatible with migrations since it
    # can't be executed while DDL lock is being held.
    - requires_fsync
    # This suite performs balancing of unsharded collection in background
    # using moveCollection that changes collections UUID
    - assumes_stable_collection_uuid
    # implicitly_retry_on_migration_in_progress.js alters find/aggregate commands
    # so that the whole result set is returned through a single batch
    - assumes_no_implicit_cursor_exhaustion
    - query_intensive_pbt
executor:
  archive:
    hooks:
      - CheckReplDBHash
      - CheckMetadataConsistencyInBackground
      - ValidateCollections
  config:
    shell_options:
      global_vars:
        TestData:
          runningWithBalancer: true
          pauseMigrationsDuringMultiUpdates: true
      eval: await import("jstests/libs/override_methods/implicitly_retry_on_migration_in_progress.js");
  hooks:
    - class: LagOplogApplicationInBackground
      shell_options:
        nodb: ""
    - class: CheckReplOplogs
    - class: CheckReplDBHash
    - class: CheckMetadataConsistencyInBackground
    - class: ValidateCollections
    - class: CheckShardFilteringMetadata
    - class: CheckOrphansDeleted
    - class: CleanEveryN
      n: 20
  fixture:
    class: ShardedClusterFixture
    configsvr_options:
      num_nodes: 3
    num_shards: 2
    num_mongos: 3
    enable_balancer: true
    random_migrations: true
    set_cluster_parameter:
      parameter: pauseMigrationsDuringMultiUpdates
      value:
        enabled: True
    mongos_options:
      set_parameters:
        enableTestCommands: 1
    mongod_options:
      set_parameters:
        enableTestCommands: 1
    num_rs_nodes_per_shard: 3
