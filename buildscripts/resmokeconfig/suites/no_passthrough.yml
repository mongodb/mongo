test_kind: js_test
description: |
  "Passthrough" means running a test against different runtime Cluster
  configurations, including topology, runtime flags, fault injections, and other
  parameters. Most tests by default are able to run in "passthrough" suites.
  NoPassthrough is an exception, where tests here only run in the exact
  configuration predefined in the tests themselves.

selector:
  roots:
    - jstests/noPassthrough/**/*.js
    - jstests/libs/property_test_helpers/self_tests/*.js
    - src/mongo/db/modules/*/jstests/live_import/*.js
    - src/mongo/db/modules/*/jstests/live_restore/*.js
    - src/mongo/db/modules/*/jstests/no_passthrough/*.js

    # Self-tests for the Concurrency testing framework are run as part of this test suite.
    - jstests/concurrency/*.js
  exclude_files:
    - jstests/noPassthrough/libs/**/*.js

    # This test expects movePrimary to be rejected while
    # authoritative shards are in mixed FCV states and in the oldest FCV the featureFlagAuthoritativeShardsCRUD is disabled.
    # TODO SERVER-98118: Delete this test once 9.0 becomes last-LTS and authoritative metadata
    # is enabled at the downgrade FCV and movePrimary succeeds, invalidating the rejection assertion.
    - jstests/noPassthrough/ddl/move_primary_ban_authoritative_mixed_fcv.js

    # TODO SERVER-98118: the test exercises authoritative metadata cloning during
    # the upgrade from a pre-9.0 last-LTS FCV. With last-LTS now at 9.0, the authoritative model is
    # already enabled at the starting FCV and the cloning expectations no longer apply.
    - jstests/noPassthrough/global_catalog/clone_authoritative_db_metadata.js

    # TODO SERVER-98118: authoritative shard catalog collections are valid at
    # last-LTS now that it is 9.0, so the expected inconsistency is no longer reported.
    - jstests/noPassthrough/ddl/check_metadata_consistency.js

    # TODO SERVER-126991: the test expects expireAfterSeconds numeric type
    # mismatches to be tolerated below FCV 9.0. Now that last-LTS is 9.0, the mismatch is reported
    # as an inconsistency and the zero-inconsistency assertion fails.
    - jstests/noPassthrough/ddl/check_metadata_consistency_expire_after_seconds_type.js

    # TODO QUERY-INTEGRATION-EXTENSIONS-API: featureFlagVectorSearchExtension was introduced in 8.3.
    # When last-LTS was 8.0, a direct shard request without ifrFlags conservatively disabled it and
    # the test expected SearchNotEnabled. Now last-LTS is 9.0, the shard uses its local default and
    # the direct request succeeds. Re-enable after updating the expectation for the new last-LTS.
    - jstests/noPassthrough/extensions/aggregation_ifr_flag_propagation.js
  exclude_with_any_tags:
    - requires_kernel_619
    - requires_kernel_7014

# noPassthrough tests start their own mongod's.
executor:
  archive:
    tests:
      - jstests/noPassthrough/oplog_writes_only_permitted_on_standalone.js
      - jstests/noPassthrough/server_parameters/redact_sensitive_server_parameters.js
      - jstests/noPassthrough/wt_unclean_shutdown.js
      - src/mongo/db/modules/*/jstests/live_restore/*.js
  config:
    shell_options:
      global_vars:
        TestData:
          setParameters:
            # Test extensions are signed with a test key, never the production key, so they cannot
            # pass signature validation on secure-mode (release) builds -- where this suite runs as a
            # release_critical task. Disable validation so jstests/noPassthrough/extensions/* can load
            # their test-signed extensions.
            featureFlagExtensionsApiSignatureValidation: false
          setParametersMongos:
            featureFlagExtensionsApiSignatureValidation: false
      nodb: ""
