test_kind: cpp_integration_test

selector:
  root: bazel-bin/install/install-mongo_integration_test_test_list.txt
  include_files:
    - bazel-bin/**/enterprise_blockstore_test*
    - bazel-bin/**/enterprise_queryable_wt_test*
executor:
  archive:
    hooks:
      - CheckReplDBHash
      - CheckReplOplogs
      - ValidateCollections
  config: {}
  hooks:
    - class: CheckReplOplogs
    - class: CheckReplDBHash
    - class: ValidateCollections
  fixture:
    class: ReplicaSetFixture
    mongod_options:
      set_parameters:
        logComponentVerbosity:
          command: 2
        enableTestCommands: 1
    num_nodes: 2
