test_kind: js_test

selector:
  roots:
    - jstests/change_stream_fsm/test_change_stream_sharding_fsm_*.js

executor:
  archive:
    tests:
      - jstests/change_stream_fsm/test_change_stream_sharding_fsm_*.js
  config:
    shell_options:
      nodb: ""
      eval: >-
        await import('jstests/libs/override_methods/implicitly_retry_on_migration_in_progress.js');
      global_vars:
        TestData:
          migrationRetryJitterMS: 2000
          migrationRetryExtraDDLCommands:
            - "create"
            - "createUnsplittableCollection"
            - "drop"
            - "dropDatabase"
            - "dropIndexes"
            - "insert"
            - "moveChunk"
            - "movePrimary"
            - "renameCollection"
            - "shardCollection"
            - "split"
          migrationRetryExtraDDLErrors:
            - "ReshardCollectionInterruptedDueToFCVChange"
            - "Interrupted"
            - "MovePrimaryInProgress"
            # A movePrimary (or dropDatabase) issued by one writer can race with an index
            # build started by a sibling writer on the same database, failing with
            # BackgroundOperationInProgressFor{Namespace,Database}. The conflict is transient:
            # retry once the build finishes.
            - "BackgroundOperationInProgressForNamespace"
            - "BackgroundOperationInProgressForDatabase"
          migrationRetryMatchFCVErrors: true
          migrationRetryWriteErrors: true
          threadOverrides:
            - "jstests/libs/override_methods/implicitly_retry_on_migration_in_progress.js"
