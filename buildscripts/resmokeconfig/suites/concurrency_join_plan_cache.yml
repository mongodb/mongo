# Requires mongorestore and ../tpc-h/tpch-0.1-normalized.archive.gz
# See jstests/query_golden/join_opt/README.plan_stability.join_opt.md
test_kind: fsm_workload_test

selector:
  roots:
    - jstests/concurrency/fsm_workloads_tpch/**/*.js

executor:
  archive:
    tests: true
  config: {}
  hooks:
    - class: CleanupConcurrencyWorkloads
  fixture:
    class: MongoDFixture
    mongod_options:
      set_parameters:
        enableTestCommands: 1
        internalEnableJoinOptimization: true
        internalEnableJoinPlanCache: true
        roleGraphInvalidationIsFatal: 1
