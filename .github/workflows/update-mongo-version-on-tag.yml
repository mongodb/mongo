name: Update MONGO_VERSION on tag

on:
  push:
    tags:
      - "r*"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    # intentionally points to @master so every branch always runs the
    # latest implementation with no per-branch backporting required.
    uses: 10gen/mongo/.github/workflows/_update-mongo-version-impl.yml@master
