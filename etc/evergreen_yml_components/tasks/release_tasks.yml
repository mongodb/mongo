          aws_key: ${aws_key}
          aws_secret: ${aws_secret}
          remote_file: ${project}/${build_variant}/${revision}/dist/mongo-${build_id}.zip
          bucket: mciuploads
          local_file: ./src/mongodb-${push_name}-${push_arch}-${version}.zip

      - command: s3.get
        display_name: "fetch dist debugsymbols"
        params:
          aws_key: ${aws_key}
          aws_secret: ${aws_secret}
          remote_file: ${project}/${build_variant}/${revision}/dist/mongo-${build_id}-debugsymbols.zip
          bucket: mciuploads
          local_file: ./src/mongodb-${push_name}-${push_arch}-debugsymbols-${version}.zip

      - func: "fetch packages"

      - func: "log into devprod container registry"
      - func: "f_expansions_write"

      - command: subprocess.exec
        display_name: "sign and generate checksums"
        params:
          binary: bash
          args:
            - "./src/evergreen/waterfall_gpg_sign.sh"
            - "mongodb-${push_name}-${push_arch}-${version}.zip"
            - "mongodb-${push_name}-${push_arch}-debugsymbols-${version}.zip"
          env:
            GARASIGN_USERNAME: ${garasign_gpg_username_60}
            GARASIGN_PASSWORD: ${garasign_gpg_password_60}
            GARASIGN_IMAGE: ${garasign_gpg_image_ecr}

      - command: subprocess.exec
        display_name: "sign msi"
        params:
          binary: bash
          args:
            - "./src/evergreen/waterfall_jsign_sign.sh"
            - "./build/cached/msi/mongodb-win32-${push_arch}-windows-${version}.msi"
            - "mongodb-${push_name}-${push_arch}-${version}-signed.msi"
          env:
            GARASIGN_USERNAME: ${garasign_jsign_username}
            GARASIGN_PASSWORD: ${garasign_jsign_password}
            GARASIGN_IMAGE: ${garasign_jsign_image_ecr}

      - func: "upload waterfall artifact"
        vars:
          local_file: "./src/mongodb-${push_name}-${push_arch}-${version}.zip"
          remote_file: "mongodb-${push_name}-${push_arch}-${version}.zip"
          upload_content_type: "application/zip"
      - func: "upload waterfall artifact"
        vars:
          local_file: "./src/mongodb-${push_name}-${push_arch}-debugsymbols-${version}.zip"
          remote_file: "mongodb-${push_name}-${push_arch}-debugsymbols-${version}.zip"
          upload_content_type: "application/zip"

      - func: "upload waterfall msi artifact"
        vars:
          local_file: "./src/mongodb-${push_name}-${push_arch}-${version}-signed.msi"
          remote_file: "mongodb-${push_name}-${push_arch}-${version}-signed.msi"
          upload_content_type: "application/x-msi"

