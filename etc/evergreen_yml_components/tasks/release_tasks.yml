functions:
  "upload waterfall artifact":
    - command: s3.put
      display_name: "upload artifact"
      params:
        role_arn: ${waterfall_role_arn}
        local_file: ${local_file}
        remote_file: server-waterfall/${project}/${revision}/${remote_file}
        bucket: origin-mongodb-server-waterfall
        permissions: private
        visibility: signed
        content_type: ${upload_content_type}
        skip_existing: true
    - command: s3.put
      display_name: "upload artifact .sig file"
      params:
        role_arn: ${waterfall_role_arn}
        local_file: ${local_file}.sig
        remote_file: server-waterfall/${project}/${revision}/${remote_file}.sig
        bucket: origin-mongodb-server-waterfall
        permissions: private
        visibility: signed
        content_type: application/pgp-signature
        skip_existing: true
    - command: s3.put
      display_name: "upload artifact .sha1 file"
      params:
        role_arn: ${waterfall_role_arn}
        local_file: ${local_file}.sha1
        remote_file: server-waterfall/${project}/${revision}/${remote_file}.sha1
        bucket: origin-mongodb-server-waterfall
        permissions: private
        visibility: signed
        content_type: text/plain
        skip_existing: true
    - command: s3.put
      display_name: "upload artifact .sha256 file"
      params:
        role_arn: ${waterfall_role_arn}
        local_file: ${local_file}.sha256
        remote_file: server-waterfall/${project}/${revision}/${remote_file}.sha256
        bucket: origin-mongodb-server-waterfall
        permissions: private
        visibility: signed
        content_type: text/plain
        skip_existing: true
    - command: s3.put
      display_name: "upload artifact .md5 file"
      params:
        role_arn: ${waterfall_role_arn}
        local_file: ${local_file}.md5
        remote_file: server-waterfall/${project}/${revision}/${remote_file}.md5
        bucket: origin-mongodb-server-waterfall
        permissions: private
        visibility: signed
        content_type: text/plain
        skip_existing: true

  "upload waterfall msi artifact":
    - command: s3.put
      display_name: "upload artifact"
      params:
        role_arn: ${waterfall_role_arn}
        local_file: ${local_file}
        remote_file: server-waterfall/${project}/${revision}/${remote_file}
        bucket: origin-mongodb-server-waterfall
        permissions: private
        visibility: signed
        content_type: ${upload_content_type}
        skip_existing: true
    - command: s3.put
      display_name: "upload artifact .sha1 file"
      params:
        role_arn: ${waterfall_role_arn}
        local_file: ${local_file}.sha1
        remote_file: server-waterfall/${project}/${revision}/${remote_file}.sha1
        bucket: origin-mongodb-server-waterfall
        permissions: private
        visibility: signed
        content_type: text/plain
        skip_existing: true
    - command: s3.put
      display_name: "upload artifact .sha256 file"
      params:
        role_arn: ${waterfall_role_arn}
        local_file: ${local_file}.sha256
        remote_file: server-waterfall/${project}/${revision}/${remote_file}.sha256
        bucket: origin-mongodb-server-waterfall
        permissions: private
        visibility: signed
        content_type: text/plain
        skip_existing: true
    - command: s3.put
      display_name: "upload artifact .md5 file"
      params:
        role_arn: ${waterfall_role_arn}
        local_file: ${local_file}.md5
        remote_file: server-waterfall/${project}/${revision}/${remote_file}.md5
        bucket: origin-mongodb-server-waterfall
        permissions: private
        visibility: signed
        content_type: text/plain
        skip_existing: true

tasks:
  - name: save_waterfall_artifacts_binaries
    run_on: rhel8.7-small
    tags: ["assigned_to_jira_team_devprod_release_infrastructure", "auxiliary"]
    allowed_requesters: ["commit"]
    stepback: false
    depends_on:
      - name: package
      - name: jsCore
    commands:
      - command: manifest.load
      - func: "f_expansions_write"
      - func: "get and apply version expansions"
      - func: "f_expansions_write"
      - command: git.get_project
        params:
          directory: src
          clone_depth: 1
      - func: "set up venv"

      - command: s3.get
        display_name: "fetch dist tarball"
        params:
          aws_key: ${aws_key}
          aws_secret: ${aws_secret}
          remote_file: ${project}/${build_variant}/${revision}/dist/mongo-${build_id}.tgz
          bucket: mciuploads
          local_file: ./src/mongodb-${push_name}-${push_arch}-${version}.tgz

      - command: s3.get
        display_name: "fetch dist debugsymbols"
        params:
          aws_key: ${aws_key}
          aws_secret: ${aws_secret}
          remote_file: ${project}/${build_variant}/${revision}/dist/mongo-${build_id}-debugsymbols.tgz
          bucket: mciuploads
          local_file: ./src/mongodb-${push_name}-${push_arch}-debugsymbols-${version}.tgz

      - func: "log into devprod container registry"
      - func: "f_expansions_write"

      - command: subprocess.exec
        display_name: "sign and generate checksums"
        params:
          binary: bash
          args:
            - "./src/evergreen/waterfall_gpg_sign.sh"
            - "mongodb-${push_name}-${push_arch}-${version}.tgz"
            - "mongodb-${push_name}-${push_arch}-debugsymbols-${version}.tgz"
          env:
            GARASIGN_USERNAME: ${garasign_gpg_username_60}
            GARASIGN_PASSWORD: ${garasign_gpg_password_60}
            GARASIGN_IMAGE: ${garasign_gpg_image_ecr}

      - func: "upload waterfall artifact"
        vars:
          local_file: "./src/mongodb-${push_name}-${push_arch}-${version}.tgz"
          remote_file: "mongodb-${push_name}-${push_arch}-${version}.tgz"
          upload_content_type: "application/gzip"
      - func: "upload waterfall artifact"
        vars:
          local_file: "./src/mongodb-${push_name}-${push_arch}-debugsymbols-${version}.tgz"
          remote_file: "mongodb-${push_name}-${push_arch}-debugsymbols-${version}.tgz"
          upload_content_type: "application/gzip"

  - name: save_waterfall_artifacts_binaries_windows
    run_on: rhel8.7-small
    tags: ["assigned_to_jira_team_devprod_release_infrastructure", "auxiliary"]
    allowed_requesters: ["commit"]
    stepback: false
    depends_on:
      - name: package
      - name: jsCore
    commands:
      - command: manifest.load
      - func: "f_expansions_write"
      - func: "get and apply version expansions"
      - func: "f_expansions_write"
      - command: git.get_project
        params:
          directory: src
          clone_depth: 1
      - func: "set up venv"

      - command: s3.get
        display_name: "fetch dist tarball"
