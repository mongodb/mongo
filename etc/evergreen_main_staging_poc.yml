#####################################################
#   Evergreen config for mongodb-main-staging-poc   #
#####################################################
# A trimmed-down alternative to etc/evergreen.yml for the main-staging-poc project.
#
# What is in here:
#   - Only build variants tagged "commit-queue", "required" or "suggested".
#   - None of the tasks that push / publish / promote / sync to external systems. The staging POC
#     doesn't have these permissions. The only reason we might want them is to frontload more
#     testing of downstream projects like streams and disagg.
#
# NOTE: Evergreen can't include a subset of the variants in a file, so the variant definitions below
# are COPIED from etc/evergreen_yml_components/variants/** (with YAML anchors resolved). Task and
# function definitions are still shared via include. The copies will drift from the originals; see
# the TODOs below, which should replace the copy with something less fragile.
#
# TODO(SERVER-138696): Generate the variants section from etc/evergreen_yml_components/variants
#   (script + a lint that it is up to date) instead of keeping a hand-maintained copy.
#
# TODO(SERVER-138697): Add broader patch coverage back once the project is stable. Candidates:
#     - The remaining non-"suggested" test_dev variants (ubuntu, mongot, wiredtiger, codecoverage,
#       sanitizer variants not tagged required/suggested).
#     - The query-team patch-only variants and their patch_aliases (query, query-quick, query-joo).
#
# TODO(SERVER-138698): Add nightly / daily cron and release coverage back once the project is
#   stable:
#     - Nightly / daily cron coverage (stm-daily-cron, compile_tasks_nightly.yml, coverity,
#       cron-activated sanitizer and perf variants).
#     - The release variants (etc/evergreen_yml_components/variants/*/test_release.yml).
#
# TODO(SERVER-138699): Re-enable the push/publish tasks once the project's AWS IAM role exists
#   (or they have been audited to be safe to run here). As an example:
#     - streams_build_and_push and everything depending on it (the streams_* tasks, streams compile
#       variants)
#     - disagg_format_snapshot* and java-driver tests
#
# See etc/evergreen.yml for the conventions on expansions and for how to set up the environment in
# a new task.

include:
  - filename: etc/evergreen_yml_components/configuration.yml
  - filename: etc/evergreen_yml_components/definitions.yml

  - filename: etc/evergreen_yml_components/tasks/resmoke/server_divisions/clusters_and_integrations/tasks.yml
  - filename: etc/evergreen_yml_components/tasks/resmoke/server_divisions/durable_transactions_and_availability/tasks.yml
  - filename: etc/evergreen_yml_components/tasks/resmoke/server_divisions/query/tasks.yml
  - filename: etc/evergreen_yml_components/tasks/resmoke/non_server_teams/tasks.yml
  - filename: etc/evergreen_yml_components/tasks/compile_tasks.yml
  - filename: etc/evergreen_yml_components/tasks/compile_tasks_shared.yml
  - filename: etc/evergreen_yml_components/tasks/misc_tasks.yml
  # Needed only for the disagg_smoke task, which the required sanitizer variants use. This also brings
  # in the (weekly cron) commit-queue-atlas variant, which runs nothing but disagg_smoke.
  - filename: src/mongo/db/modules/atlas/atlas_commit_queue.yml
  # TODO(SERVER-138699): security_tasks.yml (SBOM / SAST publishing) is excluded for now.

parameters:
  - key: evergreen_config_file_path
    value: "etc/evergreen_main_staging_poc.yml"
    description: "path to this file"
  - key: test_selection_strategies_array
    description: "Array of test selection strategies"
  - key: use_tss_staging
    description: "Set to true to ask the staging test selection deployment instead of production"
  - key: runtime_params_json
    description: 'JSON of runtime params (e.g. {"enable_linux_perf":true}) to enable on-CPU profiling on benchmark tasks.'
  - key: antithesis_suites
    description: "Comma-separated ds-antithesis suite tasks (e.g. mongod-sls-multi-cell-encryption) to run against this patch's mongod image. No antithesis run is triggered if this parameter is empty or not set."

# TODO(SERVER-138697): Add commit-queue-monorepo / commit-queue-atlas / monguard ("Lint") aliases
#   back along with their variants.
commit_queue_aliases:
  - variant: "^(commit-queue)$"
    task: "^(bazel_.*|run_.*|unit_test.*|compile_.*|lint_.*|resmoke_tests|check_for_noexcept|version_gen_validation|validate_commit_message|resmoke_validation_tests|buildscripts_test)$"
    variant_tags: []
    task_tags: []
  - variant: "^(amazon-linux2023-arm64-static-compile)$"
    variant_tags: []
    task_tags: ["clang_tidy"]

github_pr_aliases:
  - variant: "^(commit-queue)$"
    task: "^(bazel_.*|run_.*|unit_test.*|compile_.*|lint_.*|resmoke_tests|check_for_noexcept|version_gen_validation|validate_commit_message|resmoke_validation_tests|buildscripts_test)$"
    variant_tags: []
    task_tags: []
  - variant: "^(amazon-linux2023-arm64-static-compile)$"
    variant_tags: []
    task_tags: ["clang_tidy"]
  - variant: "^(al2023-arm64-sep-benchmark)$"
    variant_tags: []
    task_tags: ["benchmarks_sep"]

# TODO(SERVER-138697): Restore the query, query-quick, query-joo, security, mongot-extension,
#   codecoverage, unittestcoverage and streams aliases when their variants come back.
patch_aliases:
  - alias: required
    variant_tags: ["required"]
    task: ".*"
  - alias: suggested
    description: "Runs every variant tagged suggested, in addition to the required ones"
    variant_tags: ["required", "suggested"]
    task: ".*"
  - alias: bazel
    description: "Runs bazel build system tests"
    variant_tags: ["bazel_check"]
    task_tags: ["bazel_check"]
  - alias: bazel_variants
    description: "Runs bazel build system tests"
    variant_tags: ["bazel_check"]
    task: ".*"
  - alias: search
    description: "Runs all $search, $vectorSearch tests"
    variant: ".*"
    task: "^.*search*"
  - alias: cluster_scalability
    variant_tags: ["cluster_scalability_only"]
    task_tags: ["cluster_scalability_only"]
  - alias: disagg
    description: >
      An alternative to `required` for changes that only touch disagg (DSC) code. Runs every
      required variant except those tagged `no_atlas_build`, which cannot load DSC code. A required
      variant without the tag is included, so a missing tag runs an unneeded variant rather than
      skipping DSC coverage.
    variant_tags: ["required !no_atlas_build"]
    task: ".*"

